{% extends "base.html" %}
{% block content %}
<h1>Doctor</h1>
<div class="card">
  <p>Home: <code>{{ settings.home }}</code></p>
  <p>DB: <code>{{ settings.db_path }}</code></p>
  <p>Engines: {{ engines|length }}
    (available: {{ engines|selectattr('available')|list|length }})</p>
</div>
<button class="btn" onclick="copyReport()">Copy system report</button>
<pre id="report" class="code" hidden></pre>
<script>
async function copyReport(){
  const d=await fetch('/v1/doctor').then(r=>r.json());
  const md='```json\\n'+JSON.stringify(d,null,2)+'\\n```';
  document.getElementById('report').hidden=false;
  document.getElementById('report').textContent=md;
  navigator.clipboard.writeText(md);
}
</script>
{% endblock %}
