{% extends "base.html" %}
{% block content %}
<h1>Playground</h1>
<form class="card form" action="/v1/ocr" method="post" enctype="multipart/form-data"
      onsubmit="return playgroundSubmit(event)">
  <label>Image / PDF
    <input type="file" name="file" id="pg-file" accept="image/*,application/pdf" required/>
  </label>
  <label>Engine
    <select name="engine" id="pg-engine">
      <option value="">auto</option>
      {% for e in engines if e.available %}
      <option value="{{ e.id }}">{{ e.name }} ({{ e.kind }})</option>
      {% endfor %}
    </select>
  </label>
  <label>Language <input name="language" value="en"/></label>
  <button class="btn primary" type="submit">Run OCR</button>
</form>
<div class="split">
  <div class="card"><h3>Input</h3><img id="pg-preview" alt="" style="max-width:100%"/></div>
  <div class="card"><h3>Result</h3><pre id="pg-result" class="code">—</pre></div>
</div>
<script>
function playgroundSubmit(ev){
  ev.preventDefault();
  const fd=new FormData(ev.target);
  const f=document.getElementById('pg-file').files[0];
  if(f){const url=URL.createObjectURL(f);document.getElementById('pg-preview').src=url;}
  fetch('/v1/ocr',{method:'POST',body:fd}).then(r=>r.json()).then(j=>{
    document.getElementById('pg-result').textContent=JSON.stringify(j,null,2);
  }).catch(e=>{document.getElementById('pg-result').textContent=String(e);});
  return false;
}
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;if(!items)return;
  for(const it of items){if(it.type.startsWith('image/')){
    const file=it.getAsFile();const dt=new DataTransfer();dt.items.add(file);
    document.getElementById('pg-file').files=dt.files;
    document.getElementById('pg-preview').src=URL.createObjectURL(file);
  }}
});
</script>
{% endblock %}
