name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,api,local]"
      - name: Lint
        run: |
          ruff check ocrroute --exclude ocrroute/engines
          black --check ocrroute --exclude ocrroute/engines || true
      - name: Test
        run: pytest -q --cov=ocrroute --cov-report=term-missing
