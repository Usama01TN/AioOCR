[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrroute"
version = "0.1.0"
description = "OcrRoute — an OCR gateway for multi-engine text extraction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "OcrRoute Contributors" }]
keywords = ["ocr", "gateway", "routing", "tesseract", "document"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10.4",
    "argon2-cffi>=23.1.0",
    "ulid-py>=1.1.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "requests>=2.31.0",
    "itsdangerous>=2.1.0",
    "orjson>=3.10.0",
]

[project.optional-dependencies]
api = []
local = [
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.8.0",
]
vlm = [
    "transformers>=4.40.0",
    "torch>=2.0.0",
]
desktop = [
    "PyQt5>=5.15.0",
    "keyring>=25.0.0",
    "pytest-qt>=4.4.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-qt>=4.4.0",
    "respx>=0.21.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
    "freezegun>=1.5.0",
]
all = [
    "ocrroute[api,local,vlm,desktop,dev]",
]

[project.scripts]
ocrroute = "ocrroute.cli.main:app"

[project.urls]
Homepage = "https://github.com/ocrroute/ocrroute"
Documentation = "https://github.com/ocrroute/ocrroute/tree/main/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["ocrroute*"]

[tool.setuptools.package-data]
ocrroute = [
    "catalog/*.toml",
    "panel/templates/**/*.html",
    "panel/static/**/*",
    "desktop/resources/**/*",
    "desktop/styles/**/*",
    "tools/builtin/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["ocrroute/engines"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "ocrroute/engines"

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["ocrroute/engines", "tests"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["ocrroute"]
omit = ["ocrroute/engines/*", "ocrroute/desktop/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
